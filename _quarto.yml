project:
  type: website
  output-dir: docs

website:
  title: "Practical sessions with R"
  navbar:
    logo: img/LogoGrupo_eng.png
    logo-href: "https://spatialstatisticsupna.github.io/"
    logo-alt: "Spatial Statistics group, Public University of Navarre"
    background: "#1f4e79"
    left:
      - href: index.qmd
        text: Home
      - text: "Chapter 3 - Examples"
        menu:
          - href: Chapter3_Example1.qmd
            text: "Example 3.1: Direct and cross-semivariograms, LMC"
          - href: Chapter3_Example2.qmd
            text: "Example 3.2: Co-kriging prediction"
          - href: Chapter3_Example3.qmd
            text: "Example 3.3: Navarre weather stations"
      - text: "Chapter 3 - Exercises"
        menu:
          - href: Chapter3_Exercise1.qmd
